name: Full CI

# Dashboard/marketing unit tests remain opt-in. Add the "full-ci" label to a PR,
# or use Run workflow on the branch. Relay tests run in inference-relay.yml on
# every relevant ready PR head.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontends:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'full-ci'
    name: ${{ matrix.app }} unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-dashboard, frontend-marketing]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: ${{ matrix.app }}
      - run: npm test
        working-directory: ${{ matrix.app }}
