name: Backend

# Typecheck and unit tests for backend-api, plus typecheck and node:test unit tests
# for workers/provisioner (including its shared backend adapters).
# One Linux job, about 1 minute (billed as 1 minute). Skipped for draft PRs; runs
# when a draft is marked ready. The inference relay and the dashboard/marketing
# unit tests live in full-ci.yml (label a PR "full-ci" or run it by hand).
# No Docker, E2E, or deploys.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'backend-api/**'
      - 'workers/provisioner/**'
      - 'agent-runtime/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: typecheck and tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend-api/package-lock.json
            workers/provisioner/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: workers/provisioner
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: backend-api
      - run: npx tsc --noEmit
        working-directory: backend-api
      - run: npx jest --forceExit
        working-directory: backend-api
        env:
          # Enables __tests__/migrationPostgres.test.ts (skipped when unset; fails if unreachable).
          TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/nora_test
      - run: npm run typecheck
        working-directory: workers/provisioner
      - run: npm test
        working-directory: workers/provisioner
      # Real-PostgreSQL cancellation proof. Assumes ubuntu-latest ships PostgreSQL 16
      # binaries at /usr/lib/postgresql/16/bin; the fixture creates its own new cluster.
      - name: protected release PostgreSQL fixture
        working-directory: workers/provisioner
        run: |
          set -eu
          for mode in transaction autocommit; do
            port=$([ "$mode" = transaction ] && echo 55946 || echo 55947)
            node --import ./node_modules/tsx/dist/loader.mjs protectedReleasePostgres.fixture.mjs \
              --cluster="$RUNNER_TEMP/pg-$mode" --port=$port --mode=$mode \
              --bin=/usr/lib/postgresql/16/bin
          done
