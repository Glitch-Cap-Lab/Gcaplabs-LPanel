name: Backend

# Typecheck and unit tests for backend-api and the shared provisioner adapters,
# the inference relay's node:test suite, and the dashboard/marketing frontend
# unit tests. Linux only, pull requests only. No Docker, E2E, or deploys.

on:
  pull_request:
    paths:
      - 'backend-api/**'
      - 'workers/provisioner/**'
      - 'agent-runtime/**'
      - 'services/headmaster-inference/**'
      - 'frontend-dashboard/**'
      - 'frontend-marketing/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: typecheck and jest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend-api/package-lock.json
            workers/provisioner/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: workers/provisioner
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: backend-api
      - run: npx tsc --noEmit
        working-directory: backend-api
      - run: npx jest --forceExit
        working-directory: backend-api

  relay:
    name: inference relay node:test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/headmaster-inference/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: services/headmaster-inference
      # Live provider tests skip without OPENROUTER_API_KEY; none is set here.
      - run: npm test
        working-directory: services/headmaster-inference

  frontends:
    name: ${{ matrix.app }} unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-dashboard, frontend-marketing]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: ${{ matrix.app }}
      - run: npm test
        working-directory: ${{ matrix.app }}
