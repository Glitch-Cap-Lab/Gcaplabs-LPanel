name: Backend

# Typecheck and unit tests for backend-api, plus typecheck and node:test unit tests
# for workers/provisioner (including its shared backend adapters).
# One Linux job, about 1 minute (billed as 1 minute). Skipped for draft PRs; runs
# when a draft is marked ready. The inference relay and the dashboard/marketing
# unit tests live in full-ci.yml (label a PR "full-ci" or run it by hand).
# No Docker, E2E, or deploys.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'backend-api/**'
      - 'workers/provisioner/**'
      - 'agent-runtime/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: typecheck and tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend-api/package-lock.json
            workers/provisioner/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: workers/provisioner
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: backend-api
      - run: npx tsc --noEmit
        working-directory: backend-api
      - run: npx jest --forceExit
        working-directory: backend-api
      - run: npm run typecheck
        working-directory: workers/provisioner
      - run: npm test
        working-directory: workers/provisioner
