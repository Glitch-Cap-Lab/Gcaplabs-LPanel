name: Backend

# Typecheck and unit tests for backend-api, plus typecheck and node:test unit tests
# for workers/provisioner (including its shared backend adapters).
# One Linux job, about 1 minute (billed as 1 minute). Skipped for draft PRs; runs
# when a draft is marked ready. Each ready PR emits this check; complete Git
# diff selection inside the job skips only unrelated component tests.
# The relay has its own workflow;
# dashboard/marketing unit tests live in full-ci.yml (label or manual only).
# No Docker, E2E, or deploys.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: typecheck and tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend-api/package-lock.json
            workers/provisioner/package-lock.json
      - name: Test CI path selection
        run: node --test scripts/ci-paths.test.mjs
      - name: Select component checks from complete PR diff
        id: changes
        run: node scripts/ci-paths.mjs backend
      - run: npm ci --ignore-scripts --no-audit --no-fund
        if: steps.changes.outputs.affected == 'true'
        working-directory: workers/provisioner
      - run: npm ci --ignore-scripts --no-audit --no-fund
        if: steps.changes.outputs.affected == 'true'
        working-directory: backend-api
      - run: npx tsc --noEmit
        if: steps.changes.outputs.affected == 'true'
        working-directory: backend-api
      - run: npx jest --forceExit
        if: steps.changes.outputs.affected == 'true'
        working-directory: backend-api
      - run: npm run typecheck
        if: steps.changes.outputs.affected == 'true'
        working-directory: workers/provisioner
      - run: npm test
        if: steps.changes.outputs.affected == 'true'
        working-directory: workers/provisioner
