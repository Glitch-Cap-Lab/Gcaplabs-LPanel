name: Admin dashboard

# Helper tests and typecheck for admin-dashboard. Linux only, pull requests only,
# about 30 seconds, one job (billed as 1 minute). Skipped for draft PRs.
# Every ready PR emits this check. Complete Git diff selection inside the job
# skips only unrelated helper/typecheck work and fails closed on missing data.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-dashboard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admin:
    name: helpers and typecheck
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json
      - name: Test CI path selection
        run: node --test scripts/ci-paths.test.mjs
      - name: Select component checks from complete PR diff
        id: changes
        run: node scripts/ci-paths.mjs admin
      - run: npm ci --ignore-scripts --no-audit --no-fund
        if: steps.changes.outputs.affected == 'true'
        working-directory: admin-dashboard
      - run: npm run test:helpers
        if: steps.changes.outputs.affected == 'true'
        working-directory: admin-dashboard
      - run: npm run typecheck
        if: steps.changes.outputs.affected == 'true'
        working-directory: admin-dashboard
